<style>
#cheetah-capture-preview .arena {position:relative;width:min(100%,500px);margin:0 auto .65rem}
#cheetah-capture-preview .board {display:block;width:100%;height:auto}
#cheetah-capture-preview .piece {position:absolute;width:7.4%;height:auto;transform:translate(-50%,-50%);image-rendering:pixelated;pointer-events:none}
#cheetah-capture-preview .red {left:17.846%;top:43.569%}
#cheetah-capture-preview .blue {left:30.707%;top:43.569%}
#cheetah-capture-preview .spark {position:absolute;opacity:0;border:3px solid #ffd047;border-radius:50%;width:6%;aspect-ratio:1;box-shadow:0 0 0 2px #fff8;transform:translate(-50%,-50%);pointer-events:none}
</style>
<script>
(() => {
  const root = document.getElementById("cheetah-capture-preview");
  const board = root.querySelector(".arena"), red = root.querySelector(".red"), blue = root.querySelector(".blue");
  const ring = root.querySelector(".spark"), button = root.querySelector("button"), status = root.querySelector("[role=status]");
  const clamp = value => Math.max(0, Math.min(1, value));
  function place(piece, x, y) {
    piece.style.left = (100*x/622)+"%";
    piece.style.top = (100*y/622)+"%";
  }
  function frame(ms) {
    const hop = clamp(ms/460)*2;
    const flight = clamp((ms-600)/840);
    const ease = flight*flight*(3-2*flight);
    place(red,111+40*hop,271-10*Math.abs(Math.sin(Math.PI*hop)));
    place(blue,191+348*ease,271+172*ease-90*Math.sin(Math.PI*flight));
    blue.style.width = (7.4+10.1*ease)+"%";
    const hit = clamp((ms-440)/290);
    const land = clamp((ms-1390)/260);
    const pulse = ms<1390 ? hit : land;
    place(ring,ms<1390 ? 191 : 539,ms<1390 ? 271 : 443);
    ring.style.opacity = String(Math.sin(Math.PI*pulse));
    ring.style.width = (4+8*pulse)+"%";
  }
  button.addEventListener("click", () => {
    button.disabled = true;
    status.textContent = "Red captures blue";
    const start = performance.now();
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    function tick(now) {
      const ms = reduced ? 1650 : now-start;
      frame(ms);
      if (ms<1650) { requestAnimationFrame(tick); return; }
      status.textContent = "Blue wizard is back in its castle";
      board.setAttribute("aria-label","Red knight holds the landing square. Blue wizard is back in the blue castle.");
      button.textContent = "Replay capture";
      button.disabled = false;
    }
    requestAnimationFrame(tick);
  });
})();
</script>
